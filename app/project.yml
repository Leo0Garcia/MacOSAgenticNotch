# Generates Jarvis.xcodeproj: `cd app && xcodegen`. The generated project is
# committed so `xcodebuild -scheme Jarvis build` works without xcodegen.
name: Jarvis
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    exactVersion: 1.1.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Jarvis:
    type: application
    platform: macOS
    sources: [Jarvis]
    dependencies:
      - package: DynamicNotchKit
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        # jarvis://listen and jarvis://ask?q= (Shortcuts, "Hey Siri, Jarvis")
        CFBundleURLTypes:
          - CFBundleURLName: com.jarvis.notch
            CFBundleURLSchemes: [jarvis]
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: Jarvis listens only while you hold the push-to-talk hotkey, and transcribes on this Mac.
        # The calendar skill's EventKit helper runs under Jarvis, so macOS asks on Jarvis's behalf.
        NSCalendarsFullAccessUsageDescription: Jarvis reads your calendar to answer questions about your day. It never changes events.
        NSHumanReadableCopyright: ""
        # Where the Jarvis repo lives; the launcher and bridge run from here.
        # JARVIS_REPO in the environment overrides it.
        JarvisRepo: $(JARVIS_REPO_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.notch
        PRODUCT_NAME: Jarvis
        JARVIS_REPO_PATH: $(SRCROOT)/..
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
  JarvisTests:
    type: bundle.unit-test
    platform: macOS
    sources: [JarvisTests]
    dependencies:
      - target: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.notch.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Jarvis.app/Contents/MacOS/Jarvis
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisTests: [test]
    test:
      targets: [JarvisTests]
